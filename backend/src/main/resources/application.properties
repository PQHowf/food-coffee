# Server Port (Render provides $PORT automatically)
server.port=${PORT:8080}

# Application Name
spring.application.name=food-coffee-api

# Database Config: Supports Supabase PostgreSQL via Environment Variables, Fallbacks to H2 locally
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:foodcoffeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# HikariCP Config for Supabase Transaction Pooler (PgBouncer)
# Tắt prepared statement cache để tránh lỗi ERROR: prepared statement "S_1" already exists
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Multipart Config (iOS, Android, Mac, Win uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Upload Directory location
file.upload-dir=./uploads
